<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranger Lights</title>

<style>
body{
margin:0;
height:100vh;
background-image:url("IMG_20260309_154027.jpg");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, sans-serif;
}

.wall{
background:rgba(0,0,0,0.35);
padding:20px;
border-radius:10px;
}

.light{
display:inline-block;
width:28px;
height:28px;
margin:6px;
border-radius:50%;
background:#ff0000;
box-shadow:0 0 10px #fff,0 0 20px #ff0000;
animation:flicker 1s infinite alternate;
font-weight:bold;
color:white;
text-align:center;
line-height:28px;
}

@keyframes flicker{
0%{opacity:1;box-shadow:0 0 5px #fff,0 0 10px #ff0000;}
50%{opacity:0.6;box-shadow:0 0 20px #fff,0 0 40px #ff0000;}
100%{opacity:1;box-shadow:0 0 5px #fff,0 0 20px #ff0000;}
}

h1{
color:white;
text-align:center;
text-shadow:0 0 10px red,0 0 30px red;
}

.row{
text-align:center;
}
</style>

</head>

<body>

<div class="wall">

<h1>HAPPY BIRTHDAY</h1>

<div class="row">
<span class="light">D</span>
<span class="light">U</span>
<span class="light">S</span>
<span class="light">H</span>
<span class="light">Y</span>
<span class="light">A</span>
<span class="light">N</span>
<span class="light">T</span>
</div>

</div>

</body>
</html>
